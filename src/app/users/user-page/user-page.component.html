<div *ngIf="userToShow!=null" class="modal fade" id="userPageModal" tabindex="-1" role="dialog"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel"><span *ngIf="!consultOnly">Modify </span>{{userToShow.name}}'s info</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group row mb-1">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Name</label>
                        <div class="col-sm-10">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.name" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="form-group row mb-1">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Username</label>
                        <div class="col-sm-10">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.username"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="form-group row mb-1">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Email</label>
                        <div class="col-sm-10">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.email" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="form-group row mb-1">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Phone</label>
                        <div class="col-sm-10">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.phone" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>
                    <div class="form-group row mb-1">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Website</label>
                        <div class="col-sm-10">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.website" [ngModelOptions]="{standalone: true}">
                        </div>
                    </div>


                    <!-- address info -->
                    <div class="form-group row mb-0">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Address</label>
                        <div class="col-sm-10" *ngIf="consultOnly">
                            <input type="text" [readonly]="consultOnly"
                                [ngClass]="{'form-control-plaintext':consultOnly,'form-control':!consultOnly}"
                                id="staticEmail" [(ngModel)]="userToShow.address.fullAddresse"
                                [ngModelOptions]="{standalone: true}">
                        </div>
                        <div class="col-sm-10" *ngIf="!consultOnly">

                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Street</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.address.street"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Suite</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.address.suite"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">City</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.address.city"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Zipcode</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.address.zipcode"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                        </div>
                    </div>

                    <!-- company info -->
                    <div class="form-group row mb-0">
                        <label for="staticEmail" class="col-sm-2 col-form-label">Company</label>
                        <div class="col-sm-10" *ngIf="!consultOnly">

                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Name</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.company.name"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Catch phrase</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.company.catchPhrase"
                                    [ngModelOptions]="{standalone: true}">
                            </div>
                            <div class="input-group mb-1">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="basic-addon1">Business</span>
                                </div>
                                <input type="text" class="form-control" aria-label="Username"
                                    aria-describedby="basic-addon1" [(ngModel)]="userToShow.company.bs"
                                    [ngModelOptions]="{standalone: true}">
                            </div>

                        </div>
                    </div>




                    <!--
          <div class="form-group row">
            <label for="inputPassword" class="col-sm-2 col-form-label">Password</label>
            <div class="col-sm-10">
              <input type="password" class="form-control" id="inputPassword" placeholder="Password">
            </div>
          </div>-->



                </form>
            </div>
            <div class="modal-footer">
                <button type="button" data-toggle="modal" data-target="#modalAddConfirmation" data-dismiss="modal" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal" >Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalAddConfirmation" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Create user</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        Ara you sure to created the user?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#modalAdded" (click)="createUser()"
          data-dismiss="modal">Yes</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal" data-toggle="modal" 
        data-target="#userPageModal">Non</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal saved -->
<div class="modal fade" id="modalAdded" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Created successfully </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        The user is created successfully.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal">Ok</button>
      </div>
    </div>
  </div>
</div>
