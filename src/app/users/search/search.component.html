<!-- <input [(ngModel)]="criteria" (input)="sendCriteria();sendMessage();"> -->

<div class="input-group">
    <div class="input-group-prepend">
        <span class="input-group-text">{{'userMgt.search_name'|translate}}</span>
    </div>

    <input [(ngModel)]="criteria" (keyup)="($event.which===13)?sendCriteria():0" class="form-control">
    <div class="input-group-append">
        <button (click)="sendCriteria()" class="btn btn-outline-secondary" data-toggle="tooltip" data-placement="top"
            title="{{'userMgt.search_search'|translate}}">
            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-search" fill="currentColor"
                xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                    d="M10.442 10.442a1 1 0 0 1 1.415 0l3.85 3.85a1 1 0 0 1-1.414 1.415l-3.85-3.85a1 1 0 0 1 0-1.415z" />
                <path fill-rule="evenodd"
                    d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" />
            </svg>
        </button>
        <button (click)="criteria='';sendCriteria();" class="btn btn-outline-secondary" data-toggle="tooltip"
            data-placement="top" title="{{'userMgt.search_clear'|translate}}"><svg width="1em" height="1em"
                viewBox="0 0 16 16" class="bi bi-x" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z">
                </path>
            </svg></button>

    </div>

    <button type="button" class="btn btn-light ml-3">More search criteria
        <span class="btn-link"><svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-caret-down"
                fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                    d="M3.204 5L8 10.481 12.796 5H3.204zm-.753.659l4.796 5.48a1 1 0 0 0 1.506 0l4.796-5.48c.566-.647.106-1.659-.753-1.659H3.204a1 1 0 0 0-.753 1.659z" />
            </svg></span>

    </button>

</div>
