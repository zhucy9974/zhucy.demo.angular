<div id="user_search_more" class="row">
    <div class="col-12">
        <div class="row mb-1">

            <div class="col-sm-6 pr-0 input-group input-group-sm ">
                <div class="input-group-prepend">
                    <span class="input-group-text">{{'field.groupName'|translate}}</span>
                </div>
                <input [(ngModel)]="criterias.name" (keyup)="($event.which===13)?submitSearch():0" class="form-control">
            </div>
            <div class="col-sm-6 pr-0 pl-1 input-group input-group-sm">
                <div class="input-group-prepend">
                    <span class="input-group-text">{{'field.shortDesc'|translate}}</span>
                </div>
                <input [(ngModel)]="criterias.shortDesc" (keyup)="($event.which===13)?submitSearch():0" class="form-control">
            </div>
           
        </div>
        
        <div class="row">
            <div class="col-sm-12 pr-0">
                <div class="float-right">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend ml-1">
                            <span class="input-group-text text-white " style="background-color: #6c757d;">{{'userMgt.search_orderBy'|translate}}</span>
                        </div>
                        <select class="custom-select" [(ngModel)]="criterias.orderBy">
                            <option *ngFor="let entry of fieldsForOrder|jsonToMap" value="{{entry.key}}">
                                {{entry.value|translate}}</option>
                        </select>

                        <button (click)="submitSearch()" class="btn btn-secondary btn-sm mr-1 ml-1">
                            {{'userMgt.search_search'|translate}}
                            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-search" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd"
                                    d="M10.442 10.442a1 1 0 0 1 1.415 0l3.85 3.85a1 1 0 0 1-1.414 1.415l-3.85-3.85a1 1 0 0 1 0-1.415z" />
                                <path fill-rule="evenodd"
                                    d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0z" />
                            </svg>
                        </button>
                        <button (click)="clearCriterias();" class="btn btn-secondary btn-sm ">
                            {{'userMgt.search_clear'|translate}}
                            <svg width="1em" height="1em" viewBox="0 0 16 16" class="bi bi-x" fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg">
                                <path fill-rule="evenodd"
                                    d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z">
                                </path>
                            </svg>
                        </button>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
