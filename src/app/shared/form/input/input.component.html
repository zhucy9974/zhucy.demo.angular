<div class="form-group row mb-1">
    <label for="{{fieldName}}"
        class="col-sm-2 col-form-label">{{labelStr}}</label>
    <div class="col-sm-10">
        <input type="text" [readonly]="consultOnly"
            placeholder="{{placeholderStr}}"
            (keyup)="sendInputValue()"
            [ngClass]="{'form-control-plaintext':consultOnly,
            'form-control':!consultOnly,
            'is-invalid': (!this.propField.valid)&&submitted, 
            'is-valid':this.propField.valid&&submitted}"
            id="{{fieldName}}" [(ngModel)]="inputValue" [ngModelOptions]="{standalone: true}">
    </div>
</div>
